<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Profissional | Kleiton Simões</title>
  <!-- Vinculando a folha de estilo externa (CSS) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Container principal da aplicação -->
  <main class="container">

    <!-- Card de perfil -->
    <article class="profile-card">
      
      <!-- Cabeçalho do perfil -->
      <header class="profile-header">
        <img 
          src="assets/perfil.jpeg" 
          alt="Foto de perfil de Kleiton Simões" 
          class="profile-avatar"
        >
        <h1 class="profile-name">Kleiton Simões</h1>
        <p class="profile-title">Desenvolvedor de Software em Formação</p>
      </header>

      <!-- Biografia / Apresentação -->
      <section class="profile-bio">
        <p>
          Focado em transição de carreira para Engenharia de Software. Estudando ativamente HTML5, CSS3, JavaScript, Java e Cloud Computing.
        </p>
      </section>

      <!-- Formulário de Contato Rápido -->
      <section class="profile-contact">
        <h2>Envie uma Mensagem</h2>
        
        <form class="contact-form" action="#" method="POST">
          <div class="form-group">
            <label for="name">Seu Nome</label>
            <input type="text" id="name" name="name" placeholder="Ex: Maria Silva" required>
          </div>

          <div class="form-group">
            <label for="email">Seu E-mail</label>
            <input type="email" id="email" name="email" placeholder="maria@exemplo.com" required>
          </div>

          <div class="form-group">
            <label for="message">Mensagem</label>
            <textarea id="message" name="message" rows="3" placeholder="Olá, gostaria de falar sobre um projeto..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Enviar Mensagem</button>
        </form>
      </section>

      <!-- Rodapé com Links -->
      <footer class="profile-footer">
        <a href="https://github.com/Kleitons" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span>•</span>
        <a href="https://www.linkedin.com/in/kleitonsimoes/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </footer>

    </article>

  </main>

</body>
</html>
